name: Mantener Supabase activo

# El plan gratuito pausa el proyecto tras 7 días sin actividad. Una consulta cada 3 días lo evita.
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar la API
        run: |
          curl -fsS "${SUPABASE_URL}/rest/v1/casos?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" -H "Authorization: Bearer ${SUPABASE_ANON_KEY}"
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
